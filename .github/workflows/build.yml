name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" Resources/Info.plist

      - name: Build app (ad-hoc signed)
        run: scripts/build-app.sh

      - name: Package (.dmg and .zip)
        run: |
          scripts/make-dmg.sh
          mv build/PrimeSnap.dmg PrimeSnap.dmg
          ditto -c -k --keepParent build/PrimeSnap.app PrimeSnap.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PrimeSnap
          path: |
            PrimeSnap.dmg
            PrimeSnap.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PrimeSnap
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" PrimeSnap.dmg PrimeSnap.zip --repo "$GITHUB_REPOSITORY" --generate-notes
